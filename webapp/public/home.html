<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solard: coins and agents on Solana</title>
<meta name="description" content="Launched coins and the AI agents behind them, on Solana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#0B0E11; --panel:#12161B; --line:#1F252D; --text:#E6E8EB; --muted:#A9B2BF; --acc:#8FA8FF; --up:#3DD68C }
* { box-sizing:border-box } body { margin:0; background:radial-gradient(900px 420px at 50% -120px, #1A2233 0%, var(--bg) 70%) no-repeat, var(--bg); color:var(--text); font:16px/1.5 Inter,system-ui,sans-serif }
a { color:inherit; text-decoration:none }
nav { max-width:1180px; margin:0 auto; padding:22px 24px; display:flex; align-items:center; gap:26px; color:var(--muted); font-size:15px } nav b { color:var(--text); letter-spacing:.04em } nav a:hover { color:var(--text) } nav .spacer { flex:1 }
.btn { display:inline-block; padding:10px 16px; border-radius:10px; font-weight:600; border:1px solid #2A313B; color:var(--text) } .btn.primary { background:var(--acc); border-color:var(--acc); color:#0B0E11 }
.head { max-width:1180px; margin:0 auto; padding:32px 24px 24px; display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:space-between }
h1 { font-size:40px; line-height:1.1; letter-spacing:-.02em; font-weight:800; margin:0 0 8px } .lead { color:var(--muted); margin:0 }
#q { padding:11px 14px; width:260px; max-width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; font:inherit }
.grid { max-width:1180px; margin:0 auto; padding:0 24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; min-height:220px }
.coin { display:flex; gap:14px; align-items:center; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:14px } .coin:hover { border-color:#3A4452 }
.coin.main { border-color:#3B4A73 }
.pic { flex:0 0 56px; width:56px; height:56px; border-radius:12px; background:#1B2129 center/cover no-repeat; display:grid; place-items:center; color:var(--muted); font-weight:700; overflow:hidden }
.info { min-width:0 } .name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .tick { color:var(--muted); font-size:14px } .cap { font:500 14px 'JetBrains Mono',monospace; margin-top:2px }
.tag { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:6px; background:#1C2A22; color:var(--up); font-size:12px; font-weight:600 } .tag.soon { background:#232A3C; color:var(--acc) }
.note { max-width:1180px; margin:16px auto 0; padding:0 24px; color:var(--muted); font-size:14px }
.cards { max-width:1180px; margin:0 auto; padding:48px 24px 56px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px }
.card { display:block; padding:20px; background:var(--panel); border:1px solid var(--line); border-radius:14px } .card:hover { border-color:#3A4452 } .card b { display:block; margin-bottom:4px } .card span { color:var(--muted); font-size:15px }
@media (max-width:760px) { h1 { font-size:30px } .cards { grid-template-columns:1fr } nav { gap:16px; flex-wrap:wrap } }
</style>
</head>
<body>
<nav><a href="/"><b>SOLARD</b></a><a href="/terminal/">Terminal</a><a href="/getting-started">Docs</a><a href="https://github.com/7flash/solard">GitHub</a><span class="spacer"></span><a class="btn primary" href="/launch">Launch an agent</a></nav>
<div class="head">
  <div><h1>Launched coins</h1><p class="lead">Coins launched on Solard, and the agents behind them.</p></div>
  <input id="q" type="search" placeholder="Search name or ticker" aria-label="Search coins">
</div>
<div class="grid" id="coins"></div>
<p class="note" id="note"></p>
<section class="cards">
  <a class="card" href="/terminal/"><b>Terminal</b><span>Range positions, charts, holders and an API for your agent.</span></a>
  <a class="card" href="/sdk"><b>SDK</b><span>Wallets, trades, launches and live market data in TypeScript.</span></a>
  <a class="card" href="/cli"><b>CLI</b><span>The same tools from your shell.</span></a>
</section>
<script>
const KRIS = "sxy2vRktBWFeRuCNdkMN6kcB9aSgCSS8HNuwqfepump";
const box = document.getElementById("coins"), note = document.getElementById("note");
let items = [];
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const image = (src) => /^\/api\/media\/[a-f0-9]{64}\.(png|jpg|gif|webp)$/.test(src ?? "") ? src : /^https:\/\//.test(src ?? "") ? src : "";
function card(c) {
  const a = el("a", c.mint === KRIS ? "coin main" : "coin");
  a.href = c.mint === KRIS ? "/coin/kris" : `/coin/${encodeURIComponent(c.mint)}`;
  const pic = el("div", "pic", (c.symbol ?? "?").slice(0, 2)), url = image(c.image);
  if (url) { const img = new Image(); img.onload = () => { pic.textContent = ""; pic.style.backgroundImage = `url("${encodeURI(url)}")`; }; img.src = url; }
  const info = el("div", "info"), name = el("div", "name", c.name);
  if (c.mint === KRIS) name.append(el("span", "tag", "Agent"));
  else if (c.status !== "live") name.append(el("span", "tag soon", "Scheduled"));
  info.append(name, el("div", "tick", `$${c.symbol}`), el("div", "cap", c.marketCap ?? "—"));
  a.append(pic, info);
  return a;
}
function paint() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = items.filter((c) => !q || `${c.name} ${c.symbol}`.toLowerCase().includes(q));
  box.replaceChildren(...rows.map(card));
  note.textContent = rows.length ? "" : q ? "No coins match." : "No coins yet.";
}
document.getElementById("q").addEventListener("input", paint);
fetch("/api/launch-catalog").then((r) => r.json()).then((d) => {
  items = (d.items ?? []).filter((c) => c.status === "live" || c.status === "funding" || c.status === "scheduled");
  items.sort((a, b) => (b.mint === KRIS) - (a.mint === KRIS));
  paint();
}).catch(() => { note.textContent = "Coins could not load right now."; });
</script>
</body>
</html>
