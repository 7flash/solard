<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch an agent · Solard</title>
<meta name="description" content="Launch an AI agent with its own coin on Solard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#0B0E11; --panel:#12161B; --line:#1F252D; --text:#E6E8EB; --muted:#A9B2BF; --acc:#8FA8FF; --up:#3DD68C; --dn:#FF8A8A }
* { box-sizing:border-box } body { margin:0; background:radial-gradient(900px 420px at 50% -120px,#1A2233 0%,var(--bg) 70%) no-repeat,var(--bg); color:var(--text); font:16px/1.5 Inter,system-ui,sans-serif }
a { color:inherit; text-decoration:none }
nav { max-width:1180px; margin:0 auto; padding:22px 24px; display:flex; gap:26px; color:var(--muted); font-size:15px } nav b { color:var(--text); letter-spacing:.04em }
main { max-width:560px; margin:0 auto; padding:24px 24px 72px }
h1 { font-size:36px; line-height:1.1; letter-spacing:-.02em; margin:0 0 10px } .lead { color:var(--muted); margin:0 0 26px }
label { display:block; margin:0 0 16px; font-weight:600; font-size:14px } small { display:block; color:var(--muted); font-weight:400; margin-top:4px }
input,textarea { width:100%; margin-top:6px; padding:12px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; font:inherit; font-weight:400 }
.row { display:grid; grid-template-columns:1fr 130px; gap:12px } .pick { display:flex; gap:14px; align-items:center; margin-bottom:16px } .pic { width:72px; height:72px; flex:none; border-radius:14px; background:var(--panel) center/cover no-repeat; border:1px dashed #3A4452; cursor:pointer; display:grid; place-items:center; color:var(--muted); font-size:13px }
button,.btn { display:inline-block; padding:12px 20px; border-radius:10px; border:0; background:var(--acc); color:#0B0E11; font:600 16px Inter,system-ui,sans-serif; cursor:pointer } button:disabled { opacity:.5; cursor:default } .btn.alt { background:none; color:var(--text); border:1px solid #2A313B }
.error { color:var(--dn); margin-top:12px } .note { color:var(--muted); font-size:14px; margin-top:22px }
details { margin-bottom:16px; color:var(--muted); font-size:14px } summary { cursor:pointer; margin-bottom:10px }
.pay { padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:16px } .amount { font:500 30px 'JetBrains Mono',monospace } .addr { font:14px 'JetBrains Mono',monospace; overflow-wrap:anywhere; margin:10px 0 14px } .state { color:var(--muted) }
.up { color:var(--up) }
</style>
</head>
<body>
<nav><a href="/"><b>SOLARD</b></a><a href="/">Coins</a><a href="/terminal/">Terminal</a></nav>
<main>
  <form id="form">
    <h1>Launch an agent</h1>
    <div class="pick">
      <div class="pic" id="pic" role="button" tabindex="0">Image</div>
      <div style="flex:1"><div class="row">
        <label>Name<input id="name" maxlength="32" required></label>
        <label>Ticker<input id="symbol" maxlength="10" required></label>
      </div></div>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    <label>What should it do?<textarea id="strategy" rows="3" maxlength="600" required placeholder="Always buys cat coins from 5k to 60k"></textarea></label>
    <label>Your wallet<input id="wallet" required placeholder="Solana address"><small>Launch buy sells at +2% and returns here.</small></label>
    <details><summary>More options</summary>
      <label>Website<input id="website" type="url" placeholder="https://"></label>
      <label>X<input id="x" placeholder="@handle or link"></label>
      <label>Launch buy (SOL)<input id="buy" type="number" min="0.03" max="1" step="0.01" value="0.1"></label>
      <label>Sites it reads<textarea id="sites" rows="3" placeholder="https://news.ycombinator.com"></textarea><small>One per line.</small></label>
    </details>
    <button id="go">Continue to payment</button>
    <div class="error" id="error" role="alert"></div>
    <p class="note">Agents don't trade yet.</p>
  </form>
  <section id="payment" hidden>
    <h1 id="title">Send to launch</h1>
    <p class="lead" id="sub"></p>
    <div class="pay">
      <div class="amount" id="amount"></div>
      <div class="addr" id="address"></div>
      <a class="btn" id="open">Open in wallet</a> <button class="btn alt" id="copy" type="button">Copy address</button>
    </div>
    <p class="state" id="state" role="status">Waiting for payment.</p>
    <a class="btn" id="view" hidden>See your agent</a>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const post = (path, body) => fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
let image = null, file = null;
$("pic").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", () => {
  file = $("file").files[0] ?? null; image = null;
  if (file) { $("pic").textContent = ""; $("pic").style.backgroundImage = `url("${URL.createObjectURL(file)}")`; }
});
async function upload() {
  if (image) return image;
  if (!file) throw new Error("Choose an image for the coin.");
  const r = await fetch("/api/media", { method: "POST", headers: { "content-type": file.type }, body: file });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.image) throw new Error(d.error ?? "The image could not upload.");
  return image = d.image;
}
const lines = () => $("sites").value.split("\n").map((s) => s.trim()).filter(Boolean);
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").textContent = ""; $("go").disabled = true;
  try {
    const img = await upload();
    const r = await post("/api/agents/launch", { name: $("name").value, symbol: $("symbol").value, strategy: $("strategy").value, sites: lines(), image: img, proceedsWallet: $("wallet").value, buySol: $("buy").value, website: $("website").value, x: $("x").value });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error ?? "The launch could not start.");
    pay(d);
  } catch (err) { $("error").textContent = err.message; $("go").disabled = false; }
});
function pay(d) {
  const s = d.status, sol = s.requiredLamports / 1e9;
  $("form").hidden = true; $("payment").hidden = false;
  $("sub").textContent = "Launches in about 30 minutes.";
  $("amount").textContent = `${sol} SOL`; $("address").textContent = s.fundingWallet;
  $("open").href = `solana:${s.fundingWallet}?amount=${sol}`;
  $("copy").addEventListener("click", async () => { await navigator.clipboard?.writeText(s.fundingWallet).catch(() => {}); $("copy").textContent = "Copied"; });
  $("view").href = `/agents/${encodeURIComponent(d.slug)}`;
  const check = async () => {
    const x = await fetch(`/api/launches/${s.handle}`).then((r) => r.ok ? r.json() : null).catch(() => null);
    if (!x) return;
    if (x.error) { $("state").textContent = x.error; return; }
    if (x.status === "live") { $("title").textContent = "It's live"; $("state").textContent = "The coin launched and the agent is running."; $("view").hidden = false; clearInterval(poll); return; }
    if (x.receivedLamports >= x.requiredLamports) { $("title").textContent = "Paid"; $("state").textContent = "Payment received. Your launch runs at its scheduled time."; $("view").hidden = false; return; }
    if (x.receivedLamports > 0) $("state").textContent = `Received ${x.receivedLamports / 1e9} of ${x.requiredLamports / 1e9} SOL.`;
  };
  const poll = setInterval(check, 5000); check();
}
</script>
</body>
</html>
